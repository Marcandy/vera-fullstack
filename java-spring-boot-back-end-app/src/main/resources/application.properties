spring.application.name=vera-api

# optional: a deployed server sets real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# Hibernate creates tables, not databases: run CREATE DATABASE vera; first.
spring.datasource.url=jdbc:mysql://localhost:3306/vera?serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Set MYSQL_USER and MYSQL_PASSWORD in .env; a real password is never committed.
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# update never drops, renames or retypes a column: drop the schema by hand after
# a breaking change.
spring.jpa.hibernate.ddl-auto=update

# Off, so lazy loading outside a transaction fails instead of hiding N+1 queries.
spring.jpa.open-in-view=false

# No write-dates-as-timestamps here: Jackson 3 removed it and setting it breaks startup.
# UTC so every machine emits the same strings; the client sorts on them.
spring.jackson.time-zone=UTC

server.port=8080

spring.jpa.show-sql=true

# data.sql only runs for embedded databases unless this is set.
spring.sql.init.mode=always

# Run data.sql after Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
