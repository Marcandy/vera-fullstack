spring.application.name=vera-api

# MySQL. The schema has to exist before the application starts; Hibernate
# creates tables, not databases:
#   CREATE DATABASE vera;
spring.datasource.url=jdbc:mysql://localhost:3306/vera?serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credentials come from the environment, with local defaults, so a real
# password is never committed. Set MYSQL_USER and MYSQL_PASSWORD rather than
# editing this file.
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# update while the entities are still moving. It never drops a column, so it
# will not delete data, but it also cannot rename or retype one: expect to drop
# the schema by hand after a breaking change, and to replace this with a
# migration tool before anything real is stored.
spring.jpa.hibernate.ddl-auto=update

# Off deliberately. It keeps a session open for the whole request so lazy
# relations can load during rendering, which hides N+1 queries in the view
# layer instead of failing where the query belongs.
spring.jpa.open-in-view=false

# Timestamps go out as ISO-8601 strings, never epoch numbers, because that is
# what the front end already parses.
spring.jackson.serialization.write-dates-as-timestamps=false

# Serialise them in UTC rather than in whatever zone the machine happens to be
# in. This is a different layer from serverTimezone on the JDBC url above: that
# one governs how the driver reads and writes MySQL DATETIME columns, this one
# governs what Jackson prints. Without it a developer in Philadelphia and a
# server in UTC would emit different strings for the same instant, and the
# front end sorts these lists by comparing the raw strings.
spring.jackson.time-zone=UTC

server.port=8080
