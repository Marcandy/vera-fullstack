# Dedicated demo database; no local .env or fallback credentials in production.
spring.config.import=
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/vera_demo?sslMode=VERIFY_IDENTITY&serverTimezone=UTC&connectTimeout=5000&socketTimeout=15000
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/tmp/vera-aiven.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.servlet.session.cookie.secure=true

# Railway's HTTPS edge supplies X-Real-IP and X-Forwarded-Proto. Tomcat only
# consumes these from its trusted internal proxy addresses, not arbitrary peers.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Real-IP
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.threads.max=50

server.error.include-message=never
server.error.include-stacktrace=never
spring.devtools.restart.enabled=false
debug=false
trace=false
